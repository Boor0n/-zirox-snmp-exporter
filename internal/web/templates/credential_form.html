{{define "content"}}
<h1>{{if .Cred.ID}}Изменить «{{.Cred.Name}}»{{else}}Новые учётные данные{{end}}</h1>
{{with .Error}}<div class="flash err">{{.}}</div>{{end}}
<form method="post" action="{{if .Cred.ID}}/credentials/{{.Cred.ID}}/edit{{else}}/credentials/new{{end}}" class="card form">
  <label>Имя <input name="cred_name" value="{{.Cred.Name}}" required placeholder="например, Nexus RO v3"></label>
  {{template "credfields" .Cred}}
  <div class="buttons"><button class="primary">Сохранить</button> <a href="/credentials">Отмена</a></div>
</form>
{{end}}
