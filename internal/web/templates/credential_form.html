{{define "content"}}
<h1>{{if .Cred.ID}}Edit "{{.Cred.Name}}"{{else}}New credentials{{end}}</h1>
{{with .Error}}<div class="flash err">{{.}}</div>{{end}}
<form method="post" action="{{if .Cred.ID}}/credentials/{{.Cred.ID}}/edit{{else}}/credentials/new{{end}}" class="card form">
  <label>Name <input name="cred_name" value="{{.Cred.Name}}" required placeholder="e.g. Nexus RO v3"></label>
  {{template "credfields" .Cred}}
  <div class="buttons"><button class="primary">Save</button> <a href="/credentials">Cancel</a></div>
</form>
{{end}}
