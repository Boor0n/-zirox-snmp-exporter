{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zirox SNMP Exporter</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
{{if .User}}
<header class="top">
  <a class="brand" href="/">Zirox SNMP</a>
  <nav>
    <a href="/" {{if or (eq .Page "devices") (eq .Page "device") (eq .Page "device_form")}}class="on"{{end}}>Devices</a>
    <a href="/credentials" {{if or (eq .Page "credentials") (eq .Page "credential_form")}}class="on"{{end}}>Credentials</a>
    <a href="/profiles" {{if eq .Page "profiles"}}class="on"{{end}}>Poll profiles</a>
    <a href="/import" {{if eq .Page "import"}}class="on"{{end}}>Import</a>
    <a href="/settings" {{if eq .Page "settings"}}class="on"{{end}}>Settings</a>
    <a href="/prometheus" {{if eq .Page "prometheus"}}class="on"{{end}}>Prometheus</a>
  </nav>
  <form method="post" action="/logout" class="logout"><span>{{.User}}</span><button class="link">Log out</button></form>
</header>
{{end}}
<main>
{{with .Flash}}<div class="flash ok">{{.}}</div>{{end}}
{{with .FlashErr}}<div class="flash err">{{.}}</div>{{end}}
{{template "content" .}}
</main>
<footer>Zirox SNMP Exporter {{.Version}}</footer>
</body>
</html>{{end}}
