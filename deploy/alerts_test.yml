# Unit tests for alerts.yml: promtool test rules deploy/alerts_test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'zirox_poll_success{device="sw1",address="10.0.0.1"}'
        values: '1 0x10'
      - series: 'ifOperStatus{device="sw1",ifName="Eth1/1",ifAlias="uplink",ifIndex="1"}'
        values: '1 2x5'
      - series: 'ifAdminStatus{device="sw1",ifName="Eth1/1",ifAlias="uplink",ifIndex="1"}'
        values: '1x6'
      - series: 'ifOperStatus{device="sw1",ifName="Eth1/2",ifAlias="",ifIndex="2"}'
        values: '2x6'
      - series: 'ifAdminStatus{device="sw1",ifName="Eth1/2",ifAlias="",ifIndex="2"}'
        values: '2x6'
      - series: 'zirox_envmon_psu_state{device="sw1",index="1",name="PS1"}'
        values: '3x5'
      - series: 'zirox_envmon_psu_state{device="sw1",index="2",name="PS2"}'
        values: '5x5'
      - series: 'zirox_temperature_celsius{device="sw1",index="7",name="Inlet"}'
        values: '40 75x10'
      - series: 'ifHCInOctets{device="sw1",ifName="Eth1/3",ifAlias="",ifIndex="3"}'
        values: '0+7500000000x30'
      - series: 'ifHighSpeed{device="sw1",ifName="Eth1/3",ifAlias="",ifIndex="3"}'
        values: '1000x30'
      - series: 'zirox_bgp_peer_state{device="sw1",peer="10.0.0.2",remote_as="65002"}'
        values: '6 3x10'
      - series: 'zirox_bgp_peer_admin_status{device="sw1",peer="10.0.0.2",remote_as="65002"}'
        values: '2x10'
      - series: 'zirox_bgp_peer_state{device="sw1",peer="10.0.0.3",remote_as="65003"}'
        values: '1x10'
      - series: 'zirox_bgp_peer_admin_status{device="sw1",peer="10.0.0.3",remote_as="65003"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ZiroxDeviceUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, device: sw1, address: 10.0.0.1}
            exp_annotations:
              summary: "sw1 (10.0.0.1) does not answer SNMP"
              description: "The last SNMP polls of sw1 failed for 5 minutes. Check reachability, ACLs and credentials."
      - eval_time: 4m
        alertname: ZiroxInterfaceDown
        exp_alerts:
          - exp_labels: {severity: warning, device: sw1, ifName: Eth1/1, ifAlias: uplink, ifIndex: "1"}
            exp_annotations:
              summary: "Eth1/1 on sw1 is down"
              description: "Eth1/1 (uplink) is admin up but operationally down."
      - eval_time: 4m
        alertname: ZiroxHardwareProblem
        exp_alerts:
          - exp_labels: {severity: critical, device: sw1, index: "1", name: PS1}
            exp_annotations:
              summary: "PS1 on sw1 reports state 3"
              description: "Fan, power supply or temperature sensor is not normal (2=warning, 3=critical, 4=shutdown, 6=notFunctioning)."
      - eval_time: 8m
        alertname: ZiroxHighTemperature
        exp_alerts:
          - exp_labels: {severity: warning, device: sw1, index: "7", name: Inlet}
            exp_annotations:
              summary: "Inlet on sw1 is 75 °C"
      - eval_time: 25m
        alertname: ZiroxInterfaceHighUtilization
        exp_alerts:
          - exp_labels: {severity: warning, device: sw1, ifName: Eth1/3, ifIndex: "3"}
            exp_annotations:
              summary: "Eth1/3 on sw1 above 90% of link speed"
      - eval_time: 7m
        alertname: ZiroxBGPPeerDown
        exp_alerts:
          - exp_labels: {severity: critical, device: sw1, peer: 10.0.0.2, remote_as: "65002"}
            exp_annotations:
              summary: "BGP peer 10.0.0.2 (AS 65002) on sw1 is down"
              description: "State 3 (1=idle, 2=connect, 3=active, 4=opensent, 5=openconfirm, 6=established)."

  - interval: 1m
    input_series:
      - series: 'zirox_device_uptime_seconds{device="sw2"}'
        values: '86400 60 120 180'
      - series: 'zirox_poll_partial{device="sw2"}'
        values: '0 1x20'
      - series: 'zirox_ports_index_shifted{device="sw2"}'
        values: '0 2x40'
    alert_rule_test:
      - eval_time: 0m
        alertname: ZiroxDeviceRestarted
        exp_alerts: []
      - eval_time: 2m
        alertname: ZiroxDeviceRestarted
        exp_alerts:
          - exp_labels: {severity: info, device: sw2}
            exp_annotations:
              summary: "sw2 restarted 2m 0s ago"
              description: "Zirox refreshed the device automatically to pick up renumbered ports."
      - eval_time: 15m
        alertname: ZiroxPartialPolls
        exp_alerts:
          - exp_labels: {severity: warning, device: sw2}
            exp_annotations:
              summary: "SNMP packets to sw2 are being lost"
              description: "Some values are missing from most polls: packet loss on the way or an overloaded SNMP agent."
      - eval_time: 20m
        alertname: ZiroxPortIndexShifted
        exp_alerts: []
      - eval_time: 35m
        alertname: ZiroxPortIndexShifted
        exp_alerts:
          - exp_labels: {severity: warning, device: sw2}
            exp_annotations:
              summary: "2 ports of sw2 changed ifIndex and are not exported"
              description: "Run Refresh on the device in Zirox and check the discovery error."
