# Prometheus alerting rules for Zirox SNMP Exporter.
# Add to prometheus.yml:
#   rule_files:
#     - /etc/prometheus/zirox-alerts.yml
# Thresholds are starting points; tune them for your network.
groups:
  - name: zirox-devices
    rules:
      - alert: ZiroxDeviceUnreachable
        expr: zirox_poll_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} ({{ $labels.address }}) does not answer SNMP"
          description: "The last SNMP polls of {{ $labels.device }} failed for 5 minutes. Check reachability, ACLs and credentials."

      - alert: ZiroxHighCPU
        expr: zirox_cpu_utilization_percent{window!="5m"} > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU {{ $labels.name }} on {{ $labels.device }} at {{ $value | humanize }}%"

      - alert: ZiroxHighMemory
        expr: |
          zirox_memory_utilization_percent > 90
          or
          100 * zirox_memory_used_bytes / (zirox_memory_used_bytes + zirox_memory_free_bytes) > 90
          or
          100 * (1 - zirox_memory_available_bytes / zirox_memory_total_bytes) > 95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Memory {{ $labels.name }} on {{ $labels.device }} at {{ $value | humanize }}%"

      - alert: ZiroxHighTemperature
        expr: zirox_temperature_celsius > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.device }} is {{ $value | humanize }} °C"

      - alert: ZiroxHardwareProblem
        # CISCO-ENVMON states: 1 normal, 2 warning, 3 critical, 4 shutdown, 5 notPresent, 6 notFunctioning.
        expr: '{__name__=~"zirox_envmon_.+_state"} > 1 != 5'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.device }} reports state {{ $value }}"
          description: "Fan, power supply or temperature sensor is not normal (2=warning, 3=critical, 4=shutdown, 6=notFunctioning)."

      - alert: ZiroxStorageAlmostFull
        expr: zirox_storage_used_bytes / zirox_storage_size_bytes > 0.9 and zirox_storage_size_bytes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.device }} is {{ $value | humanizePercentage }} full"

  - name: zirox-interfaces
    rules:
      - alert: ZiroxUplinkDown
        # Ports with the role "uplink" in Zirox (device page or port rules).
        expr: ifOperStatus{role="uplink"} == 2 and ifAdminStatus == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Uplink {{ $labels.ifName }} on {{ $labels.device }} is down"
          description: "{{ $labels.ifName }} ({{ $labels.ifAlias }}) is an uplink, admin up but operationally down."

      - alert: ZiroxInterfaceDown
        # Only ports that are administratively up and selected for polling;
        # uplinks have their own critical alert above.
        expr: ifOperStatus{role!="uplink"} == 2 and ifAdminStatus == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ifName }} on {{ $labels.device }} is down"
          description: "{{ $labels.ifName }} ({{ $labels.ifAlias }}) is admin up but operationally down."

      - alert: ZiroxInterfaceFlapping
        # More than 3 up/down changes seen in 10 minutes.
        expr: changes(ifOperStatus[10m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ifName }} on {{ $labels.device }} is flapping"
          description: "The port changed state {{ $value }} times in 10 minutes (only changes between polls are seen)."

      - alert: ZiroxInterfaceErrors
        expr: rate(ifInErrors[5m]) + rate(ifOutErrors[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ifName }} on {{ $labels.device }}: {{ $value | humanize }} errors/s"

      - alert: ZiroxInterfaceHighUtilization
        expr: |
          (
            rate(ifHCInOctets[5m]) * 8 / (ifHighSpeed * 1e6) > 0.9
            or
            rate(ifHCOutOctets[5m]) * 8 / (ifHighSpeed * 1e6) > 0.9
          ) and ifHighSpeed > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ifName }} on {{ $labels.device }} above 90% of link speed"

  - name: zirox-routing
    rules:
      - alert: ZiroxBGPPeerDown
        # Peers that are administratively enabled but not established.
        expr: zirox_bgp_peer_state != 6 and on(device, peer) zirox_bgp_peer_admin_status == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "BGP peer {{ $labels.peer }} (AS {{ $labels.remote_as }}) on {{ $labels.device }} is down"
          description: "State {{ $value }} (1=idle, 2=connect, 3=active, 4=opensent, 5=openconfirm, 6=established)."

  - name: zirox-data
    rules:
      - alert: ZiroxDeviceRestarted
        # sysUpTime is the SNMP agent's uptime: a device reload or an agent restart.
        expr: zirox_device_uptime_seconds < 900
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} restarted {{ $value | humanizeDuration }} ago"
          description: "Zirox refreshed the device automatically to pick up renumbered ports."

      - alert: ZiroxPartialPolls
        # More than half of the polls in 15 minutes lost some SNMP requests.
        expr: avg_over_time(zirox_poll_partial[15m]) > 0.5
        labels:
          severity: warning
        annotations:
          summary: "SNMP packets to {{ $labels.device }} are being lost"
          description: "Some values are missing from most polls: packet loss on the way or an overloaded SNMP agent."

      - alert: ZiroxPortIndexShifted
        # The automatic Refresh normally fixes this within minutes.
        expr: zirox_ports_index_shifted > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} ports of {{ $labels.device }} changed ifIndex and are not exported"
          description: "Run Refresh on the device in Zirox and check the discovery error."

      - alert: ZiroxPollTooSlow
        # A poll that takes most of its interval delays the next one.
        expr: zirox_poll_duration_seconds > 0.8 * zirox_poll_interval_seconds
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Polling {{ $labels.device }} takes {{ $value | humanizeDuration }}, close to its interval"
          description: "Untick ports nobody looks at, give the device a longer interval, or check the SNMP agent's CPU."

  - name: zirox-servers
    rules:
      - alert: ZiroxDellHardware
        # IDRAC-MIB status: 3=ok, 4=nonCritical, 5=critical, 6=nonRecoverable.
        expr: zirox_dell_status > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.component }} {{ $labels.name }} on {{ $labels.device }} reports status {{ $value }}"
          description: "Dell iDRAC status 4=nonCritical, 5=critical, 6=nonRecoverable. Check the iDRAC log."

      - alert: ZiroxHPHardware
        # CPQHLTH-MIB condition: 2=ok, 3=degraded, 4=failed.
        expr: zirox_hp_condition > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.component }} {{ $labels.name }} on {{ $labels.device }} reports condition {{ $value }}"
          description: "HPE iLO condition 3=degraded, 4=failed. Check the iLO Integrated Management Log."
