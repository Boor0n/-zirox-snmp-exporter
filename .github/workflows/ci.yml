name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start snmpd for the integration test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq snmpd
          cat > /tmp/snmpd.conf <<'CONF'
          agentAddress udp:127.0.0.1:1161
          rocommunity testcomm 127.0.0.1
          createUser ziroxv3 SHA authpass123 AES privpass123
          rouser ziroxv3 priv
          CONF
          sudo snmpd -C -c /tmp/snmpd.conf -Lf /tmp/snmpd.log
      - run: go vet ./...
      - run: go test -race ./...
        env:
          ZIROX_TEST_SNMP: 127.0.0.1:1161
          ZIROX_SCALE: 300
      - run: docker build -t zirox-snmp-exporter:ci .
      - name: Check Prometheus alert rules and Grafana dashboard
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /tmp prometheus-3.5.0.linux-amd64/promtool
          /tmp/promtool check rules deploy/alerts.yml
          /tmp/promtool test rules deploy/alerts_test.yml
          jq -e '.panels | length > 0' deploy/grafana-dashboard.json
          sh -n deploy/install.sh
          sh -n deploy/get.sh
