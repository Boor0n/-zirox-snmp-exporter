name: release
on:
  push:
    tags: ['v*']
  # "Run workflow" button in the Actions tab: builds and publishes a release
  # from the chosen branch without pushing a tag by hand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.1.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build archives
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          ver=${VERSION}
          mkdir dist
          for arch in amd64 arm64; do
            d=zirox-${ver}-linux-${arch}
            mkdir -p "$d"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${ver}" -o "$d/zirox" ./cmd/zirox
            cp deploy/install.sh deploy/zirox.service deploy/prometheus.yml deploy/alerts.yml deploy/grafana-dashboard.json README.md "$d/"
            cp deploy/get.sh "$d/"
            tar -czf "dist/$d.tar.gz" "$d"
            mkdir -p dist-bin && cp "$d/zirox" "dist-bin/zirox-linux-$arch"
          done
          # Docker images as release assets, loaded by deploy/get.sh with
          # "docker load", so no registry login is needed.
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -f deploy/Dockerfile.release \
              -t "zirox-snmp-exporter:${ver}" --output "type=docker,dest=dist-bin/image-$arch.tar" dist-bin
            gzip -c "dist-bin/image-$arch.tar" > "dist/zirox-image-${ver}-linux-${arch}.tar.gz"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
