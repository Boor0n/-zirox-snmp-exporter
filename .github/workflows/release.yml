name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build archives
        run: |
          set -eu
          ver=${GITHUB_REF_NAME}
          mkdir dist
          for arch in amd64 arm64; do
            d=zirox-${ver}-linux-${arch}
            mkdir -p "$d"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${ver}" -o "$d/zirox" ./cmd/zirox
            cp deploy/install.sh deploy/zirox.service deploy/prometheus.yml deploy/alerts.yml deploy/grafana-dashboard.json README.md "$d/"
            tar -czf "dist/$d.tar.gz" "$d"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
